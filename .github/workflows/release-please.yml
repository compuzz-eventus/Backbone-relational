name: release-please

# Trigger automatique désactivé tant que le billing GitHub Actions n'est pas
# activé. Une fois actif, restaurer `push.branches: [master]` pour que la PR
# de release soit ouverte/mise à jour à chaque commit conventional sur master.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
